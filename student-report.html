<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التقرير الشامل للطالب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Cairo', sans-serif;
        background: #fdf6ec;
        margin: 0;
        padding: 20px;
        color: #3a2e5c;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    .card {
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 8px 24px rgba(108,92,231,0.12);
        padding: 22px;
        margin-bottom: 18px;
    }
    .header { text-align: center; margin-bottom: 10px; }
    .header h1 { font-size: 20px; color: #6c5ce7; margin: 0 0 4px; }
    .header h2 { font-size: 15px; color: #555; margin: 0; font-weight: 600; }
    .student-name { text-align: center; font-size: 22px; font-weight: 800; margin: 14px 0 4px; }
    .student-code { text-align: center; font-family: monospace; letter-spacing: 2px; color: #888; margin-bottom: 8px; }
    .row { display: flex; justify-content: space-between; padding: 8px 4px; border-bottom: 1px solid #f0ece0; font-size: 14px; }
    .row:last-child { border-bottom: none; }
    .row span:first-child { color: #777; }
    .row span:last-child { font-weight: 700; }
    .section-title { font-size: 16px; font-weight: 800; color: #6c5ce7; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .att-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
    .att-item { background: #f8f6ff; border-radius: 10px; padding: 10px 4px; }
    .att-item .num { font-size: 20px; font-weight: 800; }
    .att-item .lbl { font-size: 11px; color: #777; }
    .present .num { color: #00b894; } .absent .num { color: #e17055; }
    .late .num { color: #fdcb6e; } .makeup .num { color: #a29bfe; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 7px 5px; text-align: center; border-bottom: 1px solid #f0ece0; }
    th { color: #6c5ce7; font-weight: 700; }
    .empty { text-align: center; color: #aaa; padding: 14px; font-size: 13px; }
    .total-paid { text-align: center; background: #f0fdf4; border-radius: 10px; padding: 10px; margin-top: 10px; font-weight: 800; color: #059669; }
    .status { text-align: center; margin: 20px 0; color: #888; }
    .spinner { width: 34px; height: 34px; border: 4px solid #eee; border-top-color: #6c5ce7; border-radius: 50%; margin: 0 auto 10px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { text-align: center; font-size: 12px; color: #aaa; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
    <div class="card header">
        <h1 id="centerName">📋 التقرير الشامل للطالب</h1>
        <h2 id="teacherName"></h2>
    </div>
    <div id="statusBox" class="status">
        <div class="spinner"></div>
        جاري تحميل التقرير...
    </div>
    <div id="reportBox" style="display:none;"></div>
    <footer>تم إنشاء هذا التقرير تلقائيًا — التحديث الأخير يظهر أعلى الصفحة.</footer>
</div>
<script>
    const FIREBASE_URL = 'https://mr-alaa-booking-default-rtdb.firebaseio.com/bookingData.json';

    function getReportUrl(code) {
        const root = FIREBASE_URL.replace(/\/[^\/?]*\.json(\?.*)?$/, '');
        return `${root}/studentReports/${encodeURIComponent(code)}.json`;
    }

    function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function loadReport() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const statusBox = document.getElementById('statusBox');
        const reportBox = document.getElementById('reportBox');
        if (!code) {
            statusBox.innerHTML = '⚠️ رابط غير صحيح: لا يوجد كود طالب في الرابط.';
            return;
        }
        try {
            const res = await fetch(getReportUrl(code), { cache: 'no-cache' });
            if (!res.ok) throw new Error('تعذر الاتصال بالخادم');
            const r = await res.json();
            if (!r) {
                statusBox.innerHTML = '⚠️ لا يوجد تقرير محفوظ لهذا الطالب بعد. تواصل مع المدرّس لتحديث الرابط.';
                return;
            }
            document.getElementById('centerName').textContent = r.centerName || 'التقرير الشامل للطالب';
            document.getElementById('teacherName').textContent = r.teacherName ? `مستر / ${r.teacherName}` : '';

            const att = r.attendance || { present: 0, absent: 0, late: 0, makeup: 0 };
            const examsRows = (r.exams || []).length
                ? r.exams.map(e => `<tr><td>${esc(e.name)}</td><td>${esc(e.date || '-')}</td><td>${e.grade === null || e.grade === undefined ? '-' : esc(e.grade)}</td><td>${esc(e.total ?? '-')}</td></tr>`).join('')
                : '<tr><td colspan="4" class="empty">لا توجد امتحانات مسجلة</td></tr>';
            const paymentsRows = (r.payments || []).length
                ? r.payments.map(p => `<tr><td>${esc(p.date || '-')}</td><td>${esc(p.amount)} ج.م</td><td>${esc(p.type)}</td></tr>`).join('')
                : '<tr><td colspan="3" class="empty">لا توجد مدفوعات مسجلة</td></tr>';

            reportBox.innerHTML = `
                <div class="card">
                    <div class="student-name">${esc(r.name)}</div>
                    <div class="student-code">${esc(r.code)}</div>
                    <div class="row"><span>المجموعة</span><span>${esc(r.group || '-')}</span></div>
                    <div class="row"><span>الهاتف</span><span>${esc(r.phone || '-')}</span></div>
                    <div class="row"><span>ولي الأمر</span><span>${esc(r.parent || '-')}</span></div>
                    <div class="row"><span>نوع الدفع</span><span>${esc(r.paymentType || '-')}</span></div>
                    <div class="row"><span>الخصم</span><span>${esc(r.discount || '-')}</span></div>
                    <div class="row"><span>الملزمة</span><span>${esc(r.book || '-')}</span></div>
                    <div class="row"><span>الحالة</span><span>${esc(r.status || '-')}</span></div>
                </div>
                <div class="card">
                    <div class="section-title">✅ الحضور والغياب</div>
                    <div class="att-grid">
                        <div class="att-item present"><div class="num">${att.present || 0}</div><div class="lbl">حاضر</div></div>
                        <div class="att-item absent"><div class="num">${att.absent || 0}</div><div class="lbl">غائب</div></div>
                        <div class="att-item late"><div class="num">${att.late || 0}</div><div class="lbl">متأخر</div></div>
                        <div class="att-item makeup"><div class="num">${att.makeup || 0}</div><div class="lbl">تعويض</div></div>
                    </div>
                </div>
                <div class="card">
                    <div class="section-title">📝 الامتحانات</div>
                    <table><thead><tr><th>الاسم</th><th>التاريخ</th><th>الدرجة</th><th>الكلية</th></tr></thead><tbody>${examsRows}</tbody></table>
                </div>
                <div class="card">
                    <div class="section-title">💰 المدفوعات</div>
                    <table><thead><tr><th>التاريخ</th><th>المبلغ</th><th>النوع</th></tr></thead><tbody>${paymentsRows}</tbody></table>
                    <div class="total-paid">إجمالي المدفوعات: ${esc(r.totalPaid || 0)} ج.م</div>
                </div>
            `;
            statusBox.style.display = 'none';
            reportBox.style.display = 'block';
        } catch (err) {
            statusBox.innerHTML = '⚠️ حدث خطأ أثناء تحميل التقرير. تأكد من اتصال الإنترنت وحاول مرة أخرى.';
        }
    }
    loadReport();
</script>
</body>
</html>
